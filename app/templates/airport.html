<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DESTINO - 항공권 예약</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/static/airport.css">
</head>
<body>
    <header class="header">
        <div class="container header-inner">
            <h1 class="logo"><a href="/">DESTINO</a></h1>
            <nav class="header-nav">
                {% if nickname %}
                <span style="font-weight: 700; color: #00aaff">{{ nickname }}</span>
                <a href="/logout" style="margin-left: 15px; color: #ff5555; font-weight: 700">로그아웃</a>
                {% else %}
                <a href="/login">로그인</a>
                {% endif %}
                <a href="#">이용안내</a>
                <a href="#">고객센터</a>
                <a href="#">KOR</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="overlay" id="overlay" onclick="closeAllPopovers()"></div>

        <section class="hero-section">
            <h1 class="hero-title">가장 편안한 비행을 예약하세요</h1>

            <div class="search-widget">
                <div class="flight-tabs">
                    <button class="flight-tab-btn active" onclick="setTripType('round')">왕복</button>
                    <button class="flight-tab-btn" onclick="setTripType('one')">편도</button>
                    <button class="flight-tab-btn" onclick="setTripType('multi')">다구간</button>
                </div>

                <div class="search-form-container" id="flightForm"></div>

                <div class="action-bar">
                    <button class="add-segment-btn" id="addSegmentBtn" onclick="addMultiCitySegment()">
                        <i data-lucide="plus-circle" width="16"></i> 구간 추가
                    </button>
                    <button class="btn-search" onclick="performSearch()">검색</button>
                </div>

                <div class="popover" id="airportPopover" onclick="event.stopPropagation()">
                    <div class="popover-sidebar" id="airportRegionTabs"></div>
                    <div class="popover-content">
                        <div class="popover-search-box">
                            <input type="text" id="airportSearchInput" placeholder="도시, 공항명 검색 (예: 도쿄, NRT)" onkeyup="filterAirports()">
                        </div>
                        <div class="airport-list" id="airportList"></div>
                    </div>
                </div>

                <div class="popover passenger-popover" id="passengerPopover" onclick="event.stopPropagation()">
                    <div class="passenger-section">
                        <div class="passenger-row">
                            <div class="pass-info">
                                <span class="pass-type">성인</span>
                                <span class="pass-age">만 12세 이상</span>
                            </div>
                            <div class="counter">
                                <button type="button" onclick="updateCount('adult', -1)">-</button>
                                <span id="count-adult">1</span>
                                <button type="button" onclick="updateCount('adult', 1)">+</button>
                            </div>
                        </div>
                        <div class="passenger-row">
                            <div class="pass-info">
                                <span class="pass-type">소아</span>
                                <span class="pass-age">만 2세 ~ 12세 미만</span>
                            </div>
                            <div class="counter">
                                <button type="button" onclick="updateCount('child', -1)">-</button>
                                <span id="count-child">0</span>
                                <button type="button" onclick="updateCount('child', 1)">+</button>
                            </div>
                        </div>
                        <div class="passenger-row">
                            <div class="pass-info">
                                <span class="pass-type">유아</span>
                                <span class="pass-age">만 2세 미만</span>
                            </div>
                            <div class="counter">
                                <button type="button" onclick="updateCount('infant', -1)">-</button>
                                <span id="count-infant">0</span>
                                <button type="button" onclick="updateCount('infant', 1)">+</button>
                            </div>
                        </div>
                    </div>

                    <div class="cabin-section">
                        <label class="cabin-option">
                            <input type="radio" name="cabin" value="일반석" checked onchange="updateCabin('일반석')">
                            <span>일반석</span>
                        </label>
                        <label class="cabin-option">
                            <input type="radio" name="cabin" value="프레스티지" onchange="updateCabin('프레스티지')">
                            <span>프레스티지</span>
                        </label>
                        <label class="cabin-option">
                            <input type="radio" name="cabin" value="일등석" onchange="updateCabin('일등석')">
                            <span>일등석</span>
                        </label>
                    </div>

                    <div class="popover-footer">
                        <button type="button" class="btn-confirm" onclick="closeAllPopovers()">확인</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-top">
                <div class="footer-column">
                    <h3>고객센터</h3>
                    <p>평일 9시 ~ 18시 운영</p>
                    <p>채팅 문의: 24시간 접수</p>
                </div>
                <div class="footer-column">
                    <h3>회사</h3>
                    <ul>
                        <li><a href="#">회사소개</a></li>
                        <li><a href="#">채용정보</a></li>
                    </ul>
                </div>
                <div class="footer-column">
                    <h3>서비스</h3>
                    <ul>
                        <li><a href="#">공지사항</a></li>
                        <li><a href="#">자주 묻는 질문</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>

    <script src="/static/airport.js"></script>
</body>
</html>
