<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Destino - 비밀번호 찾기</title>
        <link rel="stylesheet" href="../static/signin.css" />
    </head>
    <body>
        <header class="header">
            <div class="container header-inner">
                <h1 class="logo"><a href="/">DESTINO</a></h1>
                <nav class="header-nav">
                    <a href="/login">로그인</a>
                    <a href="#">이용안내</a>
                    <a href="#">고객센터</a>
                    <a href="#">KOR</a>
                </nav>
            </div>
        </header>

        <main class="login-full-section">
            <div class="login-inner detail-container">
                <section class="login-title-area left-align">
                    <h2 class="form-title">비밀번호 찾기</h2>
                </section>

                <form class="email-login-form" action="/find-password" method="post">
                    {% if error %}
                    <div style="color: red; margin-bottom: 10px; text-align: center">{{ error }}</div>
                    {% endif %}
                    {% if result %}
                    <div style="color: #0f172a; margin-bottom: 10px; text-align: center; font-weight: 600">{{ result }}</div>
                    {% endif %}

                    <div class="input-group">
                        <label>아이디<span class="required-dot">*</span></label>
                        <input type="text" name="username" placeholder="아이디를 입력하세요" required />
                    </div>

                    <div class="input-group">
                        <label>이메일<span class="required-dot">*</span></label>
                        <input type="email" name="email" placeholder="이메일을 입력하세요" required />
                    </div>

                    <div class="input-group">
                        <label>휴대폰 번호<span class="required-dot">*</span></label>
                        <input type="tel" name="phone" placeholder="010-0000-0000" required />
                    </div>

                    <div class="input-group">
                        <label>새 비밀번호<span class="required-dot">*</span></label>
                        <input type="password" name="new_password" placeholder="영문/숫자/특수문자 포함 8자 이상" required />
                    </div>

                    <div class="input-group">
                        <label>새 비밀번호 확인<span class="required-dot">*</span></label>
                        <input type="password" name="new_password_confirm" placeholder="비밀번호를 다시 입력하세요" required />
                    </div>

                    <button type="submit" class="btn-login active-blue">비밀번호 변경</button>
                </form>

                <div class="login-support-box">
                    <a href="/login" class="go-signup">로그인으로 돌아가기</a>
                </div>
            </div>
        </main>
    </body>
</html>
